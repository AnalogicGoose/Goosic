[package]
name = "goosic"
version = "0.8.0"
description = "Goosic — fast, responsive YouTube Music desktop client"
authors = ["George Shyshov"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "goosic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Full DWARF for all 654 crates in the tree is what grew target/debug past
# 20 GB and made every link a multi-GB spike. Line tables still give readable
# panic backtraces (file and line), which is all the dev loop actually reads.
[profile.dev]
debug = "line-tables-only"

# Dependencies are never stepped through, so they need no debuginfo at all.
# They are the bulk of the 654, which makes this the larger half of the cut.
[profile.dev.package."*"]
debug = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    # Required for genuinely transparent WKWebView windows on macOS. Goosic
    # ships directly (not through the Mac App Store), so the private-API
    # restriction does not conflict with the current distribution channel.
    "macos-private-api",
] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features minus `cookies`: the plugin's persistent cookie store
# (app-cache/.cookies) silently captured Google's rotated session cookies
# while our requests kept replaying the static jar snapshot — Google reads
# that divergence as stolen-cookie replay and revokes the session within
# hours. We echo rotations into the jar ourselves (merge_response_cookies),
# so the shadow store must not exist: it also attached partial cookie sets
# to requests that carried no explicit Cookie header, and it kept session
# security cookies in plaintext next to our DPAPI-encrypted jar.
tauri-plugin-http = { version = "2", default-features = false, features = [
    "unsafe-headers",
    "rustls-tls",
    "http2",
    "charset",
    "macos-system-configuration",
] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
urlencoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "process", "sync", "net"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = "0.5"
cookie = "0.18"
time = "0.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# OS media controls: on Windows this is the System Media Transport Controls
# (the media tile in Quick Settings / the volume flyout, the lock screen, and
# the hardware media keys). We create the SMTC ourselves from the host process
# so the tile resolves to Goosic's own identity — the webview's built-in media
# session can't, because it belongs to the msedgewebview2.exe child process and
# shows up as "Unknown app". See src/media.rs.
souvlaki = "0.7"
# Discord Rich Presence: talks to the local Discord client over its IPC
# socket / named pipe (no native deps beyond that). Off by default; opt-in
# from Settings. See src/discord.rs. Set GOOSIC_DISCORD_APP_ID at build time
# (or edit APP_ID) to the Application ID of a Discord app named "Goosic".
discord-rich-presence = "0.2"
# MD5 for Last.fm request signing (api_sig = md5 of sorted params + secret).
# Tiny, single-purpose crate. See src/lastfm.rs.
md5 = "0.7"
# The official Deno runtime is distributed as a small ZIP archive. Goosic
# manages it beside yt-dlp so current YouTube JavaScript challenges can be
# solved on end-user machines that do not already have a JS runtime installed.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
# Verifies the pinned PO-provider plugin/source archives before executing any
# downloaded code. See `src/pot_provider.rs`.
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # SetCurrentProcessExplicitAppUserModelID — pins our AppUserModelID onto the
    # process so the SMTC media tile resolves (via the installer's matching Start
    # Menu shortcut) to "Goosic" instead of "Unknown app". See src/appid.rs.
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The hidden official player must be mapped on native Wayland or WebKitGTK can
# suspend an unrealized surface. Direct GTK access lets us map an alpha-zero,
# input-ignoring host while X11/XWayland continues to use an offscreen window.
gtk = "0.18"
# Linux equivalent of Windows DPAPI in src/secure_store.rs: a random AES key
# lives in the OS keyring (secret-service — GNOME Keyring / KWallet — with a
# kernel-keyutils fallback), and the cookie blob itself is AES-256-GCM
# encrypted locally with that key (keyrings aren't meant for arbitrary-length
# blobs, only the key is). `keyring` ships with zero backends enabled by
# default: "linux-native-sync-persistent" pulls in both the blocking
# secret-service client (`dbus-secret-service`, needs system libdbus) and the
# kernel keyutils backend, matching our synchronous (spawn_blocking) usage.
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
aes-gcm = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain stores only the random AES key; the cookie jar is
# encrypted locally because keyrings are intended for small secrets.
keyring = { version = "3", features = ["apple-native"] }
aes-gcm = "0.10"
# Native material host for the standalone player. NSGlassEffectView is used
# when the runtime provides macOS 26 Liquid Glass; older systems fall back to
# NSVisualEffectView without changing the web player implementation.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSGlassEffectView",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
# WKScriptMessageHandler transport for the web-player observer bridge:
# WKWebView refuses fetch() from the official https page to both loopback
# HTTP (private-network policy) and custom schemes, so page JS reports
# playback through a script message handler instead (see web_player.rs).
objc2-web-kit = { version = "0.3", features = [
    "WKFrameInfo",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKSecurityOrigin",
    "WKUserContentController",
    "WKWebView",
    "WKWebViewConfiguration",
] }

[dev-dependencies]
# ServiceExt::oneshot for the stream-server routing test.
tower = { version = "0.5", features = ["util"] }

# WebView2 multi-profile support, which upstream Tauri does not yet plumb.
#
# WebView2 keys an entire browser process tree — browser, GPU, network,
# storage, audio and crashpad processes — to a *user data folder*. Every
# webview needing its own cookie jar therefore cost a second full tree
# (~69 MB measured on Windows 11). WebView2 profiles solve exactly this:
# isolated storage partitions inside one folder, sharing one process tree.
#
# wry added `with_profile_name` in 0.56.1, but tauri-runtime-wry pins wry
# ^0.55 and none of the three tauri crates carry the attribute, so the API is
# unreachable from a stock build at any published version. These four patches
# backport the upstream wry change onto the pinned 0.54.4 and add the missing
# plumbing; they are additive, Windows-only, and change no default behaviour.
#
# Retire this block once the attribute lands upstream: the app-side call is
# already `WebviewWindowBuilder::profile_name`, which is the name the upstream
# API is expected to use.
[patch.crates-io]
wry = { path = "vendor/wry-0.54.4" }
tauri = { path = "vendor/tauri-2.10.3" }
tauri-runtime = { path = "vendor/tauri-runtime-2.10.1" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry-2.10.1" }
